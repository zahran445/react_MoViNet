version: "3.9"

services:
  react-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sawn-react-dashboard
    ports:
      - "5000:5000"
    volumes:
      # Persist runtime data (clips, snapshots, uploads, logs)
      - ./outputs:/app/outputs
      # Persist the primary record database
      - ./sawn.db:/app/sawn.db
      
      # NOTE: Models are now baked into the image. 
      # Mount this ONLY if you want to override internal weights from the host.
      # - ./models:/app/models
    
    environment:
      - FLASK_ENV=production
      # - CUDA_VISIBLE_DEVICES=0  # Uncomment if using GPU
    restart: unless-stopped

    # ── GPU ACCELERATION (Uncomment for NVIDIA GPUs) ──────────────────────────
